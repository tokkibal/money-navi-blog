name: Generate Blog HTML

on:
  schedule:
    - cron: "0 9 * * *"   # 매일 오전 9시에 실행한다
  workflow_dispatch:       # 수동 실행도 가능하게 한다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run script
        run: python main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: blog-html
          path: output.html
