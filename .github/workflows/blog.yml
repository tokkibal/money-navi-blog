name: Generate Blog HTML (KR + US)

on:
  schedule:
    - cron: "0 */3 * * *"    # 3시간마다 실행
  workflow_dispatch:         # 수동 실행도 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pytrends requests beautifulsoup4

      - name: Run script (South Korea)
        run: python main.py KR

      - name: Run script (United States)
        run: python main.py US

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blog-html
          path: |
            output_kr.html
            output_us.html
